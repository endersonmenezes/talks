# Correção containerizada da Carreira 01 — app gerado + suíte do professor.
# Build context = pasta track-01-sdd/ (para a suíte acessar o código gerado).
#
# Docker:  docker compose -f compose-tests.yaml up --build --abort-on-container-exit
# Podman:  podman-compose -f compose-tests.yaml up --build --abort-on-container-exit

services:
  app:
    build: ../example-generated-code/app

  suite:
    build:
      context: ..
      dockerfile: example-tests/Dockerfile.suite
    depends_on: [app]
    environment:
      - APP_URL=http://app:8000
