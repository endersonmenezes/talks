# Correção containerizada da Carreira 01 — app gerado + suíte do professor.
# Build context = pasta carreira-01-sdd/ (para a suíte acessar o código gerado).
#
# Docker:  docker compose -f compose-testes.yaml up --build --abort-on-container-exit
# Podman:  podman-compose -f compose-testes.yaml up --build --abort-on-container-exit

services:
  app:
    build: ../exemplo-codigo-gerado/app

  suite:
    build:
      context: ..
      dockerfile: exemplo-testes/Dockerfile.suite
    depends_on: [app]
    environment:
      - APP_URL=http://app:8000
